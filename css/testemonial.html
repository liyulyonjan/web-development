<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <title>This is a HTML and CSS page</title>

    <style>
        body {
            background-color: lightblue;
            box-sizing: border-box;
        }

        .card {
            width: 350px;
            background-color: white;
            border: 1px solid gray;
            border-radius: 15px;
            text-align: center;
            margin: 30px auto;
            padding: 25px;
        }

        h1 {
            color: blue;
        }

        h3 {
            color: green;
        }

        p {
            line-height: 1.6;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border-radius: 15px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>John Smith</h1>
        <h3>Web Development Student</h3>

        <p>
            I am learning HTML and CSS. I want to be a web developer.
        </p>

        <button>Contact Us</button>
    </div>

</body>
</html>
