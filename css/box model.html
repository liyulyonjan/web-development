<!DOCTYPE html>
<html>
<head>
    <title>Margin padding</title>

    <style>
        .box-model {
            width: 50%;
            background-color: gray;
            padding-left: 20px;
            padding-top: 20px;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="box-model">
        <p>
            This is a paragraph
            This is a second paragraph
        </p>

        <h1>This is a heading</h1>
    </div>

    <div class="box-model">
        <p>This is a second paragraph</p>

        <h1>This is a heading</h1>
    </div>

</body>
</html>
